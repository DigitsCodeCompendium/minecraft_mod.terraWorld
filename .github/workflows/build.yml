name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Build TerraWorld
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: chmod +x gradlew

      - name: Build and verify compatibility mod
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./gradlew clean build -Prelease_version="${GITHUB_REF_NAME#v}"
          else
            ./gradlew clean build
          fi

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          cp build/libs/tfc_toroidal_compat-*.jar release/
          cd release
          sha256sum *.jar > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraworld-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built JARs
        uses: actions/download-artifact@v5
        with:
          name: terraworld-${{ github.ref_name }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --repo "${GITHUB_REPOSITORY}"
          --title "TerraWorld ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
