plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = providers.gradleProperty('release_version').orElse(tfc_toroidal_compat_version).get()
group = 'com.terraskills.toroidalcompat'

base {
    archivesName = 'tfc-toroidal-compat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = uri('https://api.modrinth.com/maven') }
    maven { url = uri('https://maven.blamejared.com') }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Compile against the topology-aware TFC fork. Its mod id remains `tfc`,
    // so this jar replaces (rather than co-loads with) upstream TFC at runtime.
    implementation files('../tfc-toroidal-fork/build/libs/TerraFirmaCraft-NeoForge-1.21.1-4.2.9-toroidal.1.jar')
    implementation "maven.modrinth:toroidal-world:${toroidal_world_version}"
    localRuntime "maven.modrinth:tfc-mantle-mountains:${tfc_mantle_mountains_version}"
    localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

runs {
    configureEach {
        workingDirectory rootProject.layout.projectDirectory.dir('run').dir('tfc-toroidal-' + name)
        modSource sourceSets.main
    }

    client { }
    server { argument '--nogui' }
}

tasks.withType(ProcessResources).configureEach {
    def replacements = [
            mod_version           : version,
            minecraft_version     : minecraft_version,
            neo_version           : neo_version,
            tfc_version           : tfc_version,
    ]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replacements
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
